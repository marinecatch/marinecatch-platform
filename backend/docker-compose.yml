version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://marinecatch_user:devpassword123@db:5432/marinecatch_db
      - DEBUG=False
      - SECRET_KEY=local-docker-test-key
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: marinecatch_db
      POSTGRES_USER: marinecatch_user
      POSTGRES_PASSWORD: devpassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data: